[pytest]
# NiceGUI's headless `user` fixture (registered below) is an async fixture, so the suite needs
# pytest-asyncio in "auto" mode — this lets async test functions/fixtures run without an explicit
# @pytest.mark.asyncio on each. It is a no-op for the existing sync tests (researcher, adapters,
# editor, triage, bot, …): only `async def` tests/fixtures are affected.
asyncio_mode = auto

# Default NiceGUI test entrypoint: the file the `user` fixture executes (via runpy) to build the
# test app — it registers the pages and calls ui.run(). Resolved relative to this ini's directory.
# A test can override it per-test with @pytest.mark.nicegui_main_file(...).
main_file = tests/nicegui_main.py

# Register NiceGUI's HEADLESS user-fixture plugin (provides the `user`/`create_user` fixtures).
# We deliberately load `user_plugin`, NOT the umbrella `nicegui.testing.plugin`, because the
# umbrella also pulls in the browser-based `screen` fixture which imports selenium (not a dep
# here). The headless user fixture needs no browser.
addopts = -p nicegui.testing.user_plugin
