# AI Content Engine — sources config (config.yaml)
#
# Loaded read-only at startup; set once and edited by hand (no admin UI).
# AUTHORITATIVE for sources/people/topics: use this structure and exactly these
# source types and field names. Do not invent new fields or new source types.
#
# Secrets are NEVER here — only via env: X_BEARER_TOKEN,
# REDDIT_CLIENT_ID / REDDIT_CLIENT_SECRET, etc.
#
# Source types and their fields:
#   x_user      { handle }                       # a person's X account (pay-per-use read API)
#   github      { user }                          # a person's GitHub activity
#   rss         { url }                            # any feed: blog, Substack, dev.to, etc.
#   reddit_sub  { id, listing: top|hot|new, window?: hour|day|week|month|year }
#                                                  # served via the official OAuth API, not RSS
#   hn          { listing: best|top|new, min_points?: int, match?: [keywords] }
#   arxiv       { category }                       # e.g. cs.LG, cs.CL
#
# Any source may set its own `cadence` (poll interval). If omitted it inherits the
# person's cadence, then defaults.cadence. Cadence = how often we CHECK a source
# (driven by freshness need + cost), not how often the author posts.
# A topic may set a `digest` { schedule, window, top_n } — its weekly rollup.

defaults:
  cadence: 1d                       # fallback if a source sets none

# One consolidated MORNING BRIEF (top-level, one daily roundup across all topics):
# a batched Telegram message of the top new triaged stories in the lookback window,
# each still Approve/Skip -> draft. Fires daily at `schedule` (HH:MM) in the scheduler
# timezone (env DIGEST_TZ, default UTC — set it to your local tz so this fires at your
# local morning). When present it REPLACES the per-cluster drip. Omit `brief:` to keep
# the drip. window: how far back to look (Nh / Nd); top_n: max stories in the roundup.
brief: { schedule: "08:00", window: 1d, top_n: 8 }

people:
  - name: Andrej Karpathy
    cadence: 2d                     # person's tempo; cascades to their sources
    sources:
      - { type: x_user, handle: karpathy }
      - { type: github, user: karpathy }
  - name: Simon Willison
    cadence: 1d                     # blogs almost daily
    sources:
      - { type: x_user, handle: simonw }
      - { type: rss,    url: "https://simonwillison.net/atom/everything/" }
      - { type: github, user: simonw }
  - name: Sebastian Raschka
    cadence: 2d
    sources:
      - { type: x_user, handle: rasbt }
      - { type: rss,    url: "https://magazine.sebastianraschka.com/feed" }
  - name: Lilian Weng
    cadence: 3d
    sources:
      - { type: x_user, handle: lilianweng }
      - { type: rss,    url: "https://lilianweng.github.io/index.xml" }

topics:
  ai:
    sources:
      - { type: reddit_sub, id: MachineLearning, listing: top, window: day, cadence: 1d }
      - { type: reddit_sub, id: LocalLLaMA,       listing: hot,            cadence: 12h }
      - { type: hn,    listing: best, min_points: 100, match: ["LLM","AI","model","GPT"], cadence: 6h }
      - { type: arxiv, category: cs.LG, cadence: 1d }
      - { type: arxiv, category: cs.CL, cadence: 1d }
    digest: { schedule: "sun 09:00", window: 7d, top_n: 10 }
  dotnet:
    sources:
      - { type: reddit_sub, id: dotnet, listing: top, window: week, cadence: 1d }
      - { type: reddit_sub, id: csharp, listing: top, window: week, cadence: 1d }
      - { type: rss, url: "https://devblogs.microsoft.com/dotnet/feed/", cadence: 1d }
      - { type: hn,  listing: best, min_points: 50, match: [".NET","C#","dotnet"], cadence: 12h }
    digest: { schedule: "sun 10:00", window: 14d, top_n: 8 }
